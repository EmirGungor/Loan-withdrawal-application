<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Kredi Hesaplama</title>
  <link rel="stylesheet" href="style.css"/>
</head>
<body>
  <!-- Yükleme ekranı -->
  <div id="loading-screen">
    <div class="spinner"></div>
    <p>Yükleniyor...</p>
  </div>

  <div class="container" style="display:none">
    <h1>Kredi Hesaplama</h1>

    <form id="loanForm">
      <div class="input-group">
        <label for="loanAmount">Kredi Miktarı:</label>
        <input
          type="number"
          id="loanAmount"
          placeholder="Çekmek istediğiniz miktarı girin"
          min="0"
          step="0.01"
          inputmode="decimal"
          required
        />
      </div>

      <div class="input-group">
        <label for="installments">Taksit Sayısı:</label>
        <select id="installments">
          <option value="1">Tek Çekim</option>
          <option value="2">2 Taksit</option>
          <option value="3">3 Taksit</option>
          <option value="4">4 Taksit</option>
          <option value="5">5 Taksit</option>
          <option value="6">6 Taksit</option>
          <option value="7">7 Taksit</option>
          <option value="8">8 Taksit</option>
          <option value="9">9 Taksit</option>
          <option value="10">10 Taksit</option>
          <option value="11">11 Taksit</option>
          <option value="12">12 Taksit</option>
        </select>
      </div>

      <div id="result">
        <p class="change">Komisyon Oranı: <span id="commissionRatePct">0</span> %</p>
        <p class="change">Geri Ödeme Tutarı: <span id="totalAmount">0</span> ₺</p>
        <p class="change">Komisyon Tutarı: <span id="commissionAmount">0</span> ₺</p>
        <p class="change">Aylık Taksit Tutarı: <span id="monthlyInstallment">0</span> ₺</p>
      </div>
    </form>

    <!-- WhatsApp İkonu -->
    <a href="https://wa.me/+905372623966" target="_blank" rel="noopener">
      <img src="whatsapp-icon.png" alt="WhatsApp ile İletişime Geç" id="whatsapp-icon"/>
    </a>
  </div>

  <script src="script.js" defer></script>
</body>
</html>
